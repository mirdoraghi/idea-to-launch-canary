name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: PR CI / repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/workflows/pr-ci.yml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate Canary
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm audit --omit=dev --audit-level=high
          npm run build
